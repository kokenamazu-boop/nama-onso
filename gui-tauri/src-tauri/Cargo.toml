[package]
name = "nama-onso-db"
version = "0.2.0"
description = "なま音素 GUI 試作（Tauri 2 + Python サイドカー）"
authors = ["Nama"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nama_onso_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
